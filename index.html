// 入力
let touchId = null;

canvas.addEventListener("touchstart", (e) => {
  if (touchId === null) touchId = e.changedTouches[0].identifier;
  bullets.push({ x: player.x, y: player.y - 30, size: 10 });
}, {passive:true});

canvas.addEventListener("touchmove", (e) => {
  for (let t of e.changedTouches) {
    if (t.identifier === touchId) {
      player.x = t.clientX;
      player.y = t.clientY;
    }
  }
}, {passive:true});

canvas.addEventListener("touchend", (e) => {
  for (let t of e.changedTouches) {
    if (t.identifier === touchId) touchId = null;
  }
}, {passive:true});

// 敵生成
function spawnEnemy() {
  enemies.push({
    x: Math.random() * canvas.width,
    y: -100,
    size: 90,
    speed: 2.5 + Math.random() * 2.5
  });
}

// 更新
function update() {
  if (gameOver) return;

  if (Math.random() < 0.025) spawnEnemy();

  bullets.forEach(b => b.y -= 12);
  enemies.forEach(e => e.y += e.speed);

  // 画面外削除
  bullets = bullets.filter(b => b.y > -50);
  enemies = enemies.filter(e => e.y < canvas.height + 120);

  // 衝突
  for (let ei = enemies.length - 1; ei >= 0; ei--) {
    const e = enemies[ei];

    // プレイヤー衝突
    const dxp = e.x - player.x;
    const dyp = e.y - player.y;
    if (Math.hypot(dxp, dyp) < e.size * 0.5) {
      gameOver = true;
      continue;
    }

    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      const b = bullets[bi];
      const dx = e.x - b.x;
      const dy = e.y - b.y;
      if (Math.hypot(dx, dy) < e.size * 0.5) {
        enemies.splice(ei, 1);
        bullets.splice(bi, 1);
        score++;
        break;
      }
    }
  }
}

// 描画
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // プレイヤー
  ctx.fillStyle = "#00e5ff";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size/2, 0, Math.PI*2);
  ctx.fill();

  // 弾
  ctx.fillStyle = "#ffee58";
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size/2, 0, Math.PI*2);
    ctx.fill();
  });

  // 敵（画像）
  enemies.forEach(e => {
    ctx.drawImage(enemyImg, e.x - e.size/2, e.y - e.size/2, e.size, e.size);
  });

  // スコア
  ctx.fillStyle = "#fff";
  ctx.font = "20px sans-serif";
  ctx.fillText("Score: " + score, 12, 28);

  if (gameOver) {
    ctx.fillStyle = "red";
    ctx.font = "42px sans-serif";
    ctx.fillText("GAME OVER", canvas.width/2 - 140, canvas.height/2);
    ctx.font = "16px sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText("画面をリロードで再スタート", canvas.width/2 - 120, canvas.height/2 + 30);
  }
}

// ループ
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
