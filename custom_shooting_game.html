let player = {
  x: canvas.width/2,
  y: canvas.height-140,
  size: 90
};

let bullets = [];
let enemies = [];
let explosions = [];

let score = 0;
let lives = 3;
let gameOver = false;

canvas.addEventListener("touchmove", e => {
  player.x = e.touches[0].clientX;
  player.y = e.touches[0].clientY;
}, {passive:true});

canvas.addEventListener("touchstart", () => {
  bullets.push({
    x: player.x,
    y: player.y - 30,
    size: 10
  });
}, {passive:true});

function spawnEnemy() {
  enemies.push({
    x: Math.random() * (canvas.width - 100) + 50,
    y: -120,
    size: 100,
    speed: 2 + Math.random() * 2
  });
}

function update() {
  if (gameOver) return;

  if (Math.random() < 0.02) spawnEnemy();

  bullets.forEach(b => b.y -= 12);
  enemies.forEach(e => e.y += e.speed);

  bullets = bullets.filter(b => b.y > -20);

  enemies.forEach((e, ei) => {

    bullets.forEach((b, bi) => {
      const dx = e.x - b.x;
      const dy = e.y - b.y;

      if (Math.sqrt(dx*dx + dy*dy) < 50) {

        explosions.push({
          x: e.x,
          y: e.y,
          radius: 10,
          alpha: 1
        });

        enemies.splice(ei,1);
        bullets.splice(bi,1);
        score++;
      }
    });

    const pdx = e.x - player.x;
    const pdy = e.y - player.y;

    if (Math.sqrt(pdx*pdx + pdy*pdy) < 60) {

      explosions.push({
        x: player.x,
        y: player.y,
        radius: 20,
        alpha: 1
      });

      enemies.splice(ei,1);

      lives--;

      if(lives <= 0) {
        gameOver = true;
      }
    }
  });

  explosions.forEach((ex, i) => {
    ex.radius += 3;
    ex.alpha -= 0.03;

    if(ex.alpha <= 0) {
      explosions.splice(i,1);
    }
  });
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.drawImage(
    playerImg,
    player.x - player.size/2,
    player.y - player.size/2,
    player.size,
    player.size
  );

  ctx.fillStyle = "yellow";

  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.size/2,0,Math.PI*2);
    ctx.fill();
  });

  enemies.forEach(e => {
    ctx.drawImage(
      enemyImg,
      e.x - e.size/2,
      e.y - e.size/2,
      e.size,
      e.size
    );
  });

  explosions.forEach(ex => {
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI*2);

    ctx.fillStyle = `rgba(255,120,0,${ex.alpha})`;
    ctx.fill();
  });

  ctx.fillStyle = "white";
  ctx.font = "28px sans-serif";
  ctx.fillText("Score: " + score, 20, 40);

  ctx.fillStyle = "red";
  ctx.fillText("Lives: " + lives, 20, 80);

  if(gameOver) {
    ctx.fillStyle = "red";
    ctx.font = "60px sans-serif";
    ctx.fillText(
      "GAME OVER",
      canvas.width/2 - 180,
      canvas.height/2
    );
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
